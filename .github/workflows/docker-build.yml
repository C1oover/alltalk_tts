name: Build and Push Docker Image

on:
  push:
    branches: [ "alltalkbeta" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "alltalkbeta" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create conda build directory and environment file
        run: |
          mkdir -p docker/conda/build
          cat > docker/conda/build/environment-12.1.1-py3.10.yml << 'EOF'
          name: alltalk
          channels:
            - pytorch
            - nvidia
            - conda-forge
            - defaults
          dependencies:
            - python=3.10
            - pip
            - pytorch
            - pytorch-cuda=12.1
            - torchaudio
            - numpy
            - numba
            - scipy
            - scikit-learn
            - imageio
            - pandas
            - librosa
            - ffmpeg
            - tensorflow
            - flask
            - gradio
            - fastapi
            - uvicorn
            - pip:
              - inputimeout
              - tqdm
              - deepspeed
              - argparse
              - psutil
              - pyaudio
              - soundfile
              - unidecode
              - nvidia-ml-py
              - av
              - pygame
              - python-dotenv
          EOF

      - name: Build DeepSpeed wheel
        run: |
          mkdir -p docker/deepspeed/build
          git clone https://github.com/microsoft/DeepSpeed.git
          cd DeepSpeed
          pip install build
          python -m build --wheel
          mv dist/*.whl ../docker/deepspeed/build/
          cd ..
          rm -rf DeepSpeed

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CUDA_VERSION=12.1.1
            PYTHON_VERSION=3.10