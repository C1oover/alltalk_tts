name: Build and Push Docker Image

on:
  push:
    branches: [ "alltalkbeta" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "alltalkbeta" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CUDA_VERSION: "12.1.1"
  PYTHON_VERSION: "3.10"
  TTS_MODEL: "xtts"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup build cache
        uses: actions/cache@v3
        with:
          path: |
            docker/conda/build
            docker/deepspeed/build
          key: ${{ runner.os }}-build-${{ hashFiles('**/requirements*.txt', 'docker/conda/*.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Create ci-build.sh
        run: |
          cp .github/ci-build.sh ./ci-build.sh
          chmod +x ./ci-build.sh
          chmod +x ./docker/conda/build-conda-env.sh
          chmod +x ./docker/deepspeed/build-deepspeed.sh

      - name: Prepare build environment
        run: |
          ./ci-build.sh \
            --cuda-version ${{ env.CUDA_VERSION }} \
            --python-version ${{ env.PYTHON_VERSION }} \
            --tts_model ${{ env.TTS_MODEL }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: --debug

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'alltalkbeta') }}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            TTS_MODEL=${{ env.TTS_MODEL }}
            ALLTALK_DIR=/opt/alltalk
          outputs: type=docker,dest=/tmp/image.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: docker-image
          path: /tmp/image.tar