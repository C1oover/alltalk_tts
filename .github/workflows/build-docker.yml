name: Build and Push Docker Image

on:
  push:
    branches: [ alltalkbeta ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Important: Grant write permission to packages

    steps:
      - uses: actions/checkout@v3

      - name: Build DeepSpeed wheels (optional)
        run: ./docker/deepspeed/build-deepspeed.sh --python-version 3.10 # Or your version

      - name: Build and push the image
        run: |
          ./docker-build.sh --tag ${{ github.sha }}
          docker login ghcr.io -u ${{ github.repository_owner }} -p ${{ secrets.GITHUB_TOKEN }}
          docker build -t ghcr.io/${{ github.repository_owner }}/${{ github.repository_name }}:${{ github.sha }} . # Build the image
          docker push ghcr.io/${{ github.repository_owner }}/${{ github.repository_name }}:${{ github.sha }} # Push the image (optional)

      - name: Clean up Docker cache
        uses: actions/cache@v3
        with:
          path: ~/.docker/buildx/cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
